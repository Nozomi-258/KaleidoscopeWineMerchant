# ---- Gradle 运行参数 ----
# 堆上限可按机器调整;缓存与依赖都放在 GRADLE_USER_HOME,不写死在项目里。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.debug=false

# JDK 21 的定位方式(不需要写死本机路径):
#   1) 环境变量 JAVA_HOME 指向 JDK 21(推荐,也是本仓库验证过的方式);
#   2) 或命令行加 -Dorg.gradle.java.installations.paths=<你的 JDK 21 绝对路径>;
#   3) settings.gradle 里的 foojay-resolver-convention 插件会在找不到 JDK 21 时自动下载。

# ---- 映射(Parchment)----
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# ---- 版本 ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# 21.1.252 满足酒类模组要求的 >= 21.1.219
neo_version=21.1.252
neo_version_range=[21.1.219,21.2)
loader_version_range=[4,)

# ---- 模组属性 ----
mod_id=kaleidoscope_wine_merchant
mod_name=Kaleidoscope Wine Merchant
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.example.kaleidoscope.winemerchant
mod_authors=Nozomi258
mod_description=Adds a Wine Merchant villager who appraises your drinks by brew quality. Every item, price and toggle is configurable in-game.
