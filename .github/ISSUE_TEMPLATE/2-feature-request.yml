name: 💡 功能建议 / Feature request
description: 想要新的物品、新的定价方式、新的开关
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。**请尽量说明"你想解决什么问题"**,而不只是"想加什么功能" ——
        这样我能想出更合适的实现方式。

        > **English**: Please describe the problem you want solved, not only the feature
        > you have in mind. You may answer in English.

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: |
        我想让酒商只收购精品酒,普通酒不要收,但配置里要一个个关掉太麻烦。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望的实现方式(可选)
      description: 如果你已经想好了怎么做,写在这里
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪部分
      options:
        - 村民职业 / 交易内容
        - 定价 / 品质
        - 配置项
        - 指令(/wmc)
        - 方块 / 外观 / 贴图
        - 与其他模组的兼容
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过这个问题(可选)
    validations:
      required: false
